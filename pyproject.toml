[project]
name = "local-ai-data-analyst"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "langgraph>=0.2,<2",
  "langchain-ollama>=0.3,<2",
  "sqlalchemy>=2,<3",
  "psycopg[binary]>=3,<4",
  "sqlglot>=26,<30",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
